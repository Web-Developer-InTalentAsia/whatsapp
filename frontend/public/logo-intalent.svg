<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <linearGradient id="darkNavy" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0d3d5c"/>
      <stop offset="100%" stop-color="#0a2e47"/>
    </linearGradient>
    <linearGradient id="midTeal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2a6d86"/>
      <stop offset="100%" stop-color="#1e5468"/>
    </linearGradient>
    <linearGradient id="lightBlue" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5490b0"/>
      <stop offset="100%" stop-color="#3d7090"/>
    </linearGradient>
    <linearGradient id="midBlueGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a82a0"/>
      <stop offset="100%" stop-color="#2e6480"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════════════
       MAIN ICON — 3 interlocked cube-person figures
       forming a triangular/diamond shape
       ══════════════════════════════════════════════ -->

  <!-- ── TOP PERSON (darkest navy) ── -->
  <!-- Head circle -->
  <circle cx="200" cy="42" r="26" fill="url(#darkNavy)"/>
  <!-- Neck -->
  <rect x="192" y="64" width="16" height="12" rx="4" fill="url(#darkNavy)"/>
  <!-- Cube body — 3D hexagon -->
  <polygon points="200,82 240,105 240,150 200,173 160,150 160,105" fill="url(#darkNavy)"/>
  <!-- 3D face lines -->
  <line x1="200" y1="82" x2="200" y2="173" stroke="#ffffff18" stroke-width="2"/>
  <line x1="160" y1="105" x2="240" y2="105" stroke="#ffffff18" stroke-width="1.5"/>
  <!-- Right face of cube (lighter) -->
  <polygon points="200,82 240,105 240,150 200,173" fill="#1a5070" opacity="0.6"/>
  <!-- Bottom face of cube -->
  <polygon points="160,150 200,173 240,150 200,168" fill="#0a2035" opacity="0.5"/>

  <!-- ── LEFT PERSON (medium blue-teal) ── -->
  <!-- Positioned lower left -->
  <circle cx="108" cy="160" r="22" fill="url(#midTeal)"/>
  <rect x="100" y="180" width="14" height="10" rx="3" fill="url(#midTeal)"/>
  <polygon points="108,192 144,213 144,254 108,274 72,254 72,213" fill="url(#midTeal)"/>
  <!-- Right face -->
  <polygon points="108,192 144,213 144,254 108,274" fill="#2a5e76" opacity="0.6"/>
  <!-- Bottom face -->
  <polygon points="72,254 108,274 144,254 108,270" fill="#0f2e40" opacity="0.5"/>

  <!-- ── RIGHT PERSON (lighter steel blue) ── -->
  <!-- Positioned lower right -->
  <circle cx="292" cy="160" r="22" fill="url(#lightBlue)"/>
  <rect x="284" y="180" width="14" height="10" rx="3" fill="url(#lightBlue)"/>
  <polygon points="292,192 328,213 328,254 292,274 256,254 256,213" fill="url(#lightBlue)"/>
  <!-- Right face (even lighter) -->
  <polygon points="292,192 328,213 328,254 292,274" fill="#6aaaca" opacity="0.5"/>
  <!-- Bottom face -->
  <polygon points="256,254 292,274 328,254 292,270" fill="#1e3a4e" opacity="0.5"/>

  <!-- ── CONNECTING ARMS between figures ── -->
  <!-- Left arm: top-person body left → left-person body right -->
  <path d="M 165 128 Q 140 155 140 200" stroke="#2a6d86" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Right arm: top-person body right → right-person body left -->
  <path d="M 235 128 Q 260 155 260 200" stroke="#4a82a0" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Bottom arm: left-person → right-person -->
  <path d="M 144 240 L 256 240" stroke="#2e5c78" stroke-width="9" stroke-linecap="round" opacity="0.6"/>

  <!-- ══════════════════════════════════════════════
       COMPANY NAME
       ══════════════════════════════════════════════ -->
  <text
    x="200" y="325"
    font-family="'Arial Black', 'Trebuchet MS', Arial, sans-serif"
    font-weight="900"
    font-size="42"
    fill="#0d3d5c"
    text-anchor="middle"
    letter-spacing="-1"
  >InTalent Asia</text>

  <!-- TM mark -->
  <text
    x="316" y="308"
    font-family="Arial, sans-serif"
    font-size="14"
    fill="#0d3d5c"
    text-anchor="start"
  >™</text>

  <!-- ══════════════════════════════════════════════
       TAGLINE
       ══════════════════════════════════════════════ -->
  <text
    x="200" y="360"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="14"
    fill="#3d7a96"
    text-anchor="middle"
    letter-spacing="2.5"
  >YOUR SUCCESS IS OUR GOAL</text>

  <!-- Thin underline accent -->
  <rect x="140" y="368" width="120" height="2" rx="1" fill="#2a6d86" opacity="0.4"/>
</svg>
